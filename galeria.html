<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gagosian Gallery</title>
  <link rel="shortcut icon" href="img/download.jpeg" type="image/x-icon">

<body>
  <main class="gallery-container">

        <section class="sobre">
            <p>Essas obras nascem do encontro entre o instinto criativo e a alma intensa que guia suas mãos: </p>
        </section>

        <div id="particles-js"></div>


    <div class="gallery">
      <img src="img/vangogh.jpg" alt="Obra 1" class="obra hidden">
      <img src="img/borboletas.jpg" alt="Obra 2" class="obra hidden">
      <img src="img/onça.jpg" alt="Obra 3" class="obra hidden">
    </div>

    <button id="btnSurpresa">SURPRESA</button>

    <div class="surpresa hidden">
      <img src="img/motoqueiro-fantasma.png" alt="Obra Surpresa" class="obra hidden">
    </div>
    
  </main>






  <!-- Rodapé -->
  <footer>
    <p class="frase">"Sua visão transforma o mundo em arte. Não pare de desenhar."</p>
    <p class="assinatura">— Victor H.</p>
  </footer>

  <script src="intro.js"></script>

</html>
